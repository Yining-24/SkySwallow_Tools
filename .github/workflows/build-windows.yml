name: Build Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'skyswallow_tools/**'
      - '*.py'
      - 'frontend/**'
      - 'requirements*.txt'
      - 'SkySwallowTools.spec'
      - 'installer/**'
      - 'tests/**'

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Check configuration permission rules
        run: python -m unittest -q tests.test_configuration_acl

      - name: Build Windows application
        run: python -m PyInstaller --clean --noconfirm SkySwallowTools.spec

      - name: Test packaged Windows application
        shell: pwsh
        run: |
          $instancePath = Join-Path $env:RUNNER_TEMP "SkySwallowToolsTest"
          New-Item -ItemType Directory -Force -Path $instancePath | Out-Null

          @'
          SECRET_KEY = "github-actions-smoke-test-only"

          PASSWORD_HASHES = {
              "admin": "pbkdf2:sha256:1000000$4e9021dc5ba27a78$1451677b38218e1d03d85470dd5e0241f2d7ebbc535116515c771ed4552fa01e",
              "finance": "unused-in-smoke-test",
              "followup": "unused-in-smoke-test",
          }
          '@ | Set-Content `
            -Path (Join-Path $instancePath "config.py") `
            -Encoding utf8

          $env:SKYSWALLOW_INSTANCE_PATH = $instancePath
          $outputLog = Join-Path $env:RUNNER_TEMP "server-output.log"
          $errorLog = Join-Path $env:RUNNER_TEMP "server-error.log"

          $server = Start-Process `
            -FilePath "dist/SkySwallowTools/SkySwallowServer.exe" `
            -PassThru `
            -RedirectStandardOutput $outputLog `
            -RedirectStandardError $errorLog

          try {
              $serverReady = $false

              for ($attempt = 1; $attempt -le 30; $attempt++) {
                  if ($server.HasExited) {
                      throw "The packaged server stopped unexpectedly."
                  }

                  try {
                      $health = Invoke-RestMethod `
                        -Uri "http://127.0.0.1:5001/api/health" `
                        -TimeoutSec 2

                      if ($health.status -eq "ok") {
                          $serverReady = $true
                          break
                      }
                  }
                  catch {
                      Start-Sleep -Seconds 1
                  }
              }

              if (-not $serverReady) {
                  throw "The packaged server did not become ready within 30 seconds."
              }

              $homepage = Invoke-WebRequest `
                -Uri "http://127.0.0.1:5001/" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($homepage.StatusCode -ne 200) {
                  throw "The homepage returned HTTP $($homepage.StatusCode)."
              }

              $session = Invoke-RestMethod `
                -Uri "http://127.0.0.1:5001/api/auth/session" `
                -TimeoutSec 5

              if ($session.authenticated -ne $false) {
                  throw "A new session should not already be authenticated."
              }

              $browserSession = New-Object `
                Microsoft.PowerShell.Commands.WebRequestSession
              $login = Invoke-RestMethod `
                -Uri "http://127.0.0.1:5001/api/auth/login" `
                -Method Post `
                -ContentType "application/json" `
                -Body '{"role":"admin","password":"SkyTest2026!"}' `
                -WebSession $browserSession `
                -TimeoutSec 5

              if ($login.authenticated -ne $true) {
                  throw "Administrator login failed."
              }

              $signedIn = Invoke-RestMethod `
                -Uri "http://127.0.0.1:5001/api/auth/session" `
                -WebSession $browserSession `
                -TimeoutSec 5

              if ($signedIn.role -ne "admin") {
                  throw "The administrator session was not retained."
              }

              Write-Host "Packaged Windows application passed the smoke test."
          }
          finally {
              if (-not $server.HasExited) {
                  Stop-Process -Id $server.Id -Force
              }

              Write-Host "Server output:"
              Get-Content $outputLog -ErrorAction SilentlyContinue

              Write-Host "Server errors:"
              Get-Content $errorLog -ErrorAction SilentlyContinue
          }

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/SkySwallowTools/* `
            -DestinationPath dist/SkySwallowTools-windows-x64.zip

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $compiler)) {
              throw "Inno Setup compiler was not found: $compiler"
          }

          & $compiler "installer/SkySwallowTools.iss"

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Test Windows installer
        shell: pwsh
        run: |
          $installer = Resolve-Path `
            "dist/SkySwallowTools-Setup-windows-x64.exe"
          $installPath = Join-Path $env:RUNNER_TEMP "SkySwallowInstalled"
          $installation = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=$installPath"
            ) `
            -Wait `
            -PassThru

          if ($installation.ExitCode -ne 0) {
              throw "The installer exited with code $($installation.ExitCode)."
          }

          if (-not (Test-Path (Join-Path $installPath "SkySwallowServer.exe"))) {
              throw "The installed server executable was not found."
          }

          if (-not (Test-Path (Join-Path $installPath "_internal/frontend/dist/index.html"))) {
              throw "The installed frontend was not found."
          }

      - name: Test installed app and first-time configuration
        shell: pwsh
        run: |
          $installPath = Join-Path $env:RUNNER_TEMP "SkySwallowInstalled"
          $env:SKYSWALLOW_INSTANCE_PATH = Join-Path `
            $env:RUNNER_TEMP `
            "SkySwallowInstalledConfig"
          python -m tests.prepare_installer_config

          if ($LASTEXITCODE -ne 0) {
              throw "First-time configuration failed. See the Python error above."
          }

          $configPath = Join-Path $env:SKYSWALLOW_INSTANCE_PATH "config.py"
          $broadGroups = @("S-1-1-0", "S-1-5-11", "S-1-5-32-545")

          foreach ($path in @($env:SKYSWALLOW_INSTANCE_PATH, $configPath)) {
              $acl = Get-Acl $path
              $owner = $acl.GetOwner(
                  [System.Security.Principal.SecurityIdentifier]
              ).Value

              if ($owner -ne "S-1-5-32-544") {
                  throw "Unexpected configuration owner on ${path}: $owner"
              }

              foreach ($entry in $acl.Access) {
                  $sid = $entry.IdentityReference.Translate(
                    [System.Security.Principal.SecurityIdentifier]
                  ).Value

                  if ($sid -in $broadGroups) {
                      throw "Configuration is accessible by a broad group: $sid"
                  }
              }
          }

          $server = Start-Process `
            -FilePath (Join-Path $installPath "SkySwallowServer.exe") `
            -PassThru `
            -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "installed-output.log") `
            -RedirectStandardError (Join-Path $env:RUNNER_TEMP "installed-errors.log")

          try {
              $ready = $false

              for ($attempt = 1; $attempt -le 30; $attempt++) {
                  if ($server.HasExited) {
                      throw "The installed server stopped unexpectedly."
                  }

                  try {
                      $health = Invoke-RestMethod `
                        -Uri "http://127.0.0.1:5001/api/health" `
                        -TimeoutSec 2

                      if ($health.status -eq "ok") {
                          $ready = $true
                          break
                      }
                  }
                  catch {
                      Start-Sleep -Seconds 1
                  }
              }

              if (-not $ready) {
                  throw "The installed server did not start."
              }

              $login = Invoke-RestMethod `
                -Uri "http://127.0.0.1:5001/api/auth/login" `
                -Method Post `
                -ContentType "application/json" `
                -Body '{"role":"admin","password":"AdminSmokeTest2026!"}' `
                -TimeoutSec 5

              if ($login.role -ne "admin") {
                  throw "The installed server rejected its first-time password."
              }
          }
          finally {
              if (-not $server.HasExited) {
                  Stop-Process -Id $server.Id -Force
              }

              Get-Content (Join-Path $env:RUNNER_TEMP "installed-output.log") `
                -ErrorAction SilentlyContinue
              Get-Content (Join-Path $env:RUNNER_TEMP "installed-errors.log") `
                -ErrorAction SilentlyContinue
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          path: dist/SkySwallowTools-windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/SkySwallowTools-Setup-windows-x64.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
