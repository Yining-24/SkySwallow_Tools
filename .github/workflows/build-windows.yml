name: Build Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows application
        run: python -m PyInstaller --clean --noconfirm SkySwallowTools.spec

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/SkySwallowTools/* `
            -DestinationPath dist/SkySwallowTools-windows-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          path: dist/SkySwallowTools-windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
